apis:
- name: garten TV MCP Server
  description: 'A Model Context Protocol server published on garten''s own host at
    https://tv.garten.co/mcp, serving the garten TV wellness-video property. The endpoint
    is provided by the Uscreen streaming platform that powers garten TV (observed via
    the powered-by-uscreen markup and the uscreen.io frame-ancestors CSP) but is served
    under garten''s domain and advertises garten TV as the OAuth issuer. Anonymous
    tools/list returns HTTP 401 with an RFC 9728 WWW-Authenticate challenge, so the
    tool set and input schemas require authenticated introspection; the OAuth authorization-server
    and protected-resource metadata are anonymous and were harvested verbatim.'
