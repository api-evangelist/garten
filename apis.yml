aid: garten
name: Garten
description: 'garten (styled lowercase; formerly Oh My Green) is a workplace food and
  wellbeing company founded in 2014 by Michael Heinrich and backed by Y Combinator,
  headquartered in the San Francisco Bay Area. It runs turn-key office micro-kitchens
  and pantries (garten Kitchen), self-serve micro-markets with cashless checkout kiosks
  (garten Market), corporate catering and cafe management (garten Catering), and virtual
  and on-site wellbeing programming (garten Wellbeing, plus the garten TV streaming
  property), serving employers including Google, Nike, Ford and Autodesk across roughly
  twenty US metros. garten was acquired by the chef-driven catering platform HUNGRY
  in 2025. garten publishes no public developer portal, API reference, SDK or machine-readable
  REST contract: its client ordering surface at client.garten.co / api.garten.co is
  a credentialed Spree/Solidus commerce application whose API rejects anonymous calls
  with "You must specify an API key." The one genuinely public, machine-readable agent
  surface sits on its Uscreen-powered streaming property garten TV (tv.garten.co),
  which serves a Model Context Protocol server at /mcp guarded by a full OAuth 2.1
  stack: RFC 9728 protected-resource metadata, RFC 8414 authorization-server metadata,
  PKCE S256, RFC 7591 dynamic client registration, RFC 8707 resource indicators, and
  seven named read/write scopes.'
